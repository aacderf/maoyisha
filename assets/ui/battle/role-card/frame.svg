  <rect x="14.5" y="13.5" width="211" height="333" rx="20" stroke="url(#gold)" stroke-width="4.5"/>
  <rect x="20" y="19" width="199" height="321" rx="15" fill="url(#grain)" stroke="#4D3013" stroke-width="1.2"/>

