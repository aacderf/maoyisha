<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 360" fill="none">
  <defs>
    <linearGradient id="gold" x1="31" y1="9" x2="214" y2="349" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF3BF"/>
      <stop offset=".16" stop-color="#C68E3B"/>
      <stop offset=".34" stop-color="#6B3F17"/>
      <stop offset=".52" stop-color="#F1CD73"/>
      <stop offset=".72" stop-color="#8B551E"/>
      <stop offset="1" stop-color="#FFE39A"/>
    </linearGradient>
    <linearGradient id="dark" x1="35" y1="14" x2="210" y2="346" gradientUnits="userSpaceOnUse">
