<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 360" fill="none">
  <defs>
    <linearGradient id="gold" x1="31" y1="9" x2="214" y2="349" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF3BF"/>
      <stop offset=".16" stop-color="#C68E3B"/>
      <stop offset=".34" stop-color="#6B3F17"/>
      <stop offset=".52" stop-color="#F1CD73"/>
      <stop offset=".72" stop-color="#8B551E"/>
      <stop offset="1" stop-color="#FFE39A"/>
    </linearGradient>
    <linearGradient id="dark" x1="35" y1="14" x2="210" y2="346" gradientUnits="userSpaceOnUse">
      <stop stop-color="#272117"/>
      <stop offset=".38" stop-color="#080806"/>
      <stop offset=".66" stop-color="#12100B"/>
      <stop offset="1" stop-color="#302010"/>
    </linearGradient>
    <linearGradient id="spine" x1="22" y1="42" x2="60" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4B2B12"/>
      <stop offset=".28" stop-color="#15100A"/>
      <stop offset=".72" stop-color="#0A0805"/>
      <stop offset="1" stop-color="#5B3717"/>
    </linearGradient>
    <pattern id="grain" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M1 4h8M4 12h10M11 2h4M0 15h6" stroke="#FFF2B6" stroke-opacity=".045" stroke-width="1"/>
      <path d="M2 8h11M7 5h8" stroke="#000" stroke-opacity=".22" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-24" y="-24" width="288" height="408" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#000" flood-opacity=".72"/>
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#F4CC68" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect x="7" y="6" width="226" height="348" rx="27" fill="#050403" filter="url(#shadow)"/>
  <rect x="10" y="9" width="220" height="342" rx="24" fill="url(#dark)" stroke="#080503" stroke-width="7"/>
  <rect x="14.5" y="13.5" width="211" height="333" rx="20" stroke="url(#gold)" stroke-width="4.5"/>
  <rect x="20" y="19" width="199" height="321" rx="15" fill="url(#grain)" stroke="#4D3013" stroke-width="1.2"/>

  <!-- top hp rail -->
  <path d="M57 24H203c7 0 12 5 12 12v27H57V24Z" fill="#100E0A" fill-opacity=".94" stroke="#6D471C" stroke-width="1.2"/>
  <path d="M64 58H198" stroke="url(#gold)" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M77 35h98" stroke="#FFF0B8" stroke-opacity=".08" stroke-width="8" stroke-linecap="round"/>

  <!-- portrait window rim: art-first, names and equipment live outside the card in CSS -->
  <path d="M24 66H216V335H24V66Z" fill="#030302" fill-opacity=".34" stroke="#9B6B2A" stroke-width="1.6"/>
  <path d="M28 70H212V331H28V70Z" stroke="#E0B65F" stroke-opacity=".28" stroke-width="1"/>

  <!-- ornaments -->
  <path d="M94 345c16 8 36 8 52 0M110 340c5 5 15 5 20 0" stroke="url(#gold)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M32 328c18 9 36 9 54 0M154 328c18 9 36 9 54 0" stroke="#C58E43" stroke-opacity=".55" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M207 31l11 11M207 55l11-11M27 31l-8 9M27 54l-8-9" stroke="#F3CE74" stroke-opacity=".62" stroke-width="1.3"/>
</svg>
