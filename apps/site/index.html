<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="HL 的游戏作品主页，展示茂一杀、月下符札、构建流程和 Windows 下载信息。"
    />
    <meta name="theme-color" content="#121212" />
    <title>HL | 茂一杀作品主页</title>
    <style>
      :root {
        color-scheme: dark;
        --skeleton-bg: #121212;
        --skeleton-surface: #1a1a1a;
        --skeleton-line: rgb(244 234 215 / 0.14);
        --skeleton-soft: #212121;
        --skeleton-accent: #d9ad58;
      }

      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --skeleton-bg: #f7f7f4;
          --skeleton-surface: #ffffff;
          --skeleton-line: rgb(33 33 33 / 0.12);
          --skeleton-soft: #eeeeea;
          --skeleton-accent: #8f5e24;
        }
      }

      body {
        margin: 0;
        background: var(--skeleton-bg);
      }

      .boot-skeleton {
        display: grid;
        min-height: 100dvh;
        grid-template-rows: 64px 1fr;
        color: transparent;
        font-family: system-ui, sans-serif;
      }

      .boot-nav {
        border-bottom: 1px solid var(--skeleton-line);
        background: var(--skeleton-bg);
      }

      .boot-main {
        display: grid;
        width: min(1280px, calc(100% - 32px));
        grid-template-columns: minmax(0, 1fr) minmax(320px, 1fr);
        gap: 48px;
        align-items: center;
        margin-inline: auto;
        padding: 48px 0;
      }

      .boot-copy,
      .boot-shot {
        display: grid;
        gap: 16px;
      }

      .boot-line,
      .boot-title,
      .boot-button,
      .boot-image,
      .boot-meta {
        overflow: hidden;
        border-radius: 8px;
        background: linear-gradient(90deg, var(--skeleton-surface), var(--skeleton-soft), var(--skeleton-surface));
        background-size: 200% 100%;
        animation: skeleton-shimmer 1200ms cubic-bezier(0.33, 1, 0.68, 1) infinite;
      }

      .boot-line {
        width: 160px;
        height: 16px;
      }

      .boot-title {
        width: min(360px, 80vw);
        height: 56px;
      }

      .boot-copy .boot-line:nth-child(3) {
        width: min(520px, 100%);
      }

      .boot-button {
        width: 160px;
        height: 40px;
        background: var(--skeleton-accent);
      }

      .boot-image {
        aspect-ratio: 16 / 9;
        border: 1px solid var(--skeleton-line);
      }

      .boot-meta {
        height: 48px;
      }

      @keyframes skeleton-shimmer {
        from {
          background-position: 200% 0;
        }

        to {
          background-position: -200% 0;
        }
      }

      @media (max-width: 760px) {
        .boot-main {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-skeleton" aria-hidden="true">
        <div class="boot-nav"></div>
        <main class="boot-main">
          <section class="boot-copy">
            <div class="boot-line"></div>
            <div class="boot-title"></div>
            <div class="boot-line"></div>
            <div class="boot-button"></div>
          </section>
          <section class="boot-shot">
            <div class="boot-image"></div>
            <div class="boot-meta"></div>
          </section>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
