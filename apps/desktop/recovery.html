<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>茂一杀启动恢复</title>
  <style>
    html,body{margin:0;min-height:100%;background:#090b09;color:#f6efdf;font-family:"Microsoft YaHei",system-ui,sans-serif}
    body{display:grid;place-items:center;padding:28px;box-sizing:border-box}
    main{width:min(620px,100%);border:1px solid #5e5a4d;border-radius:10px;background:#20211d;padding:24px;box-sizing:border-box}
    h1{margin:0 0 10px;font-size:26px}p{color:#d1c6af;line-height:1.6}.detail{padding:12px;background:#10110f;border-radius:7px;color:#efb5ad;word-break:break-word}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}button{min-height:40px;border:1px solid #d8ae58;border-radius:7px;background:#30291e;color:#f6efdf;padding:8px 15px;cursor:pointer}
    button.secondary{border-color:#5e5a4d;background:#171916}
  </style>
</head>
<body>
  <main>
    <h1>启动未完成</h1>
    <p>游戏已停止继续加载，避免停留在黑屏。可以重新启动，或打开日志目录查看原因。</p>
    <p class="detail" id="detail">未知错误</p>
    <div class="actions">
      <button onclick="window.desktopApp.restart()">重新启动游戏</button>
      <button class="secondary" onclick="window.desktopApp.openLogs()">打开日志目录</button>
    </div>
  </main>
  <script>
    document.getElementById("detail").textContent =
      new URLSearchParams(location.search).get("detail") || "未知错误";
  </script>
</body>
</html>
